<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabs</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: #fff;
      padding: 8px 16px 0;
      border-bottom: 1px solid #ddd;
    }
    .tab {
      padding: 10px 20px;
      cursor: default;
      color: #666;
      border-bottom: 3px solid transparent;
    }
    .tab.active {
      color: #000;
      font-weight: 600;
      border-bottom-color: #4c7bf4;
    }
    .content {
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active">About</div>
    <div class="tab">Product</div>
    <div class="tab">Pricing</div>
    <div class="tab">Contact</div>
  </div>
  <div class="content"></div>
</body>
</html>
